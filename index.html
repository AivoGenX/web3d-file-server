<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3D 资源库 - Three.js、Cesium、WebGPU 资源中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #10b981;
            --accent: #f59e0b;
            --dark: #1e293b;
            --dark-2: #334155;
            --light: #f8fafc;
            --light-2: #e2e8f0;
            --text: #334155;
            --text-light: #64748b;
            --border: #cbd5e1;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --gradient: linear-gradient(135deg, var(--primary), var(--primary-light));
            --gradient-dark: linear-gradient(135deg, var(--primary-dark), var(--primary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--light);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background: var(--gradient-dark);
            padding: 80px 0 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* Controls */
        .controls {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin: -40px auto 40px;
            max-width: 1200px;
            position: relative;
            z-index: 10;
        }

        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--light);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 12px 24px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: var(--light);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-tab:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
        }

        .filter-tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Resources Grid */
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .resource-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .resource-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .resource-card:hover::before {
            left: 100%;
        }

        .resource-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .resource-icon {
            width: 60px;
            height: 60px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .resource-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--light);
        }

        .resource-description {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .resource-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .resource-type {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary-light);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .resource-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: var(--light);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-light);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Footer */
        .footer {
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 0;
            text-align: center;
            margin-top: 60px;
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .footer p {
            margin-bottom: 10px;
            opacity: 0.8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 60px 0 40px;
            }

            .logo {
                font-size: 2.5rem;
            }

            .controls {
                margin: -20px auto 30px;
                padding: 20px;
            }

            .resources-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .stats {
                gap: 20px;
            }

            .stat-number {
                font-size: 2rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--secondary);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            animation: slideInRight 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Web3D 资源库</h1>
            <p class="subtitle">专业的 Three.js、Cesium、WebGPU 资源中心，为您的 3D 项目提供丰富的素材和工具</p>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="total-files">0</div>
                    <div class="stat-label">总文件数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="total-categories">0</div>
                    <div class="stat-label">资源分类</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="total-size">0 GB</div>
                    <div class="stat-label">资源总量</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Controls -->
    <div class="controls">
        <div class="search-box">
            <input type="text" class="search-input" id="search-input" placeholder="搜索资源名称、类型或描述...">
            <i class="fas fa-search search-icon"></i>
        </div>
        
        <div class="filter-tabs">
            <div class="filter-tab active" data-filter="all">
                <i class="fas fa-layer-group"></i>
                全部资源
            </div>
            <div class="filter-tab" data-filter="glb">
                <i class="fas fa-cube"></i>
                3D 模型
            </div>
            <div class="filter-tab" data-filter="texture">
                <i class="fas fa-image"></i>
                贴图材质
            </div>
            <div class="filter-tab" data-filter="json">
                <i class="fas fa-code"></i>
                数据文件
            </div>
            <div class="filter-tab" data-filter="audio">
                <i class="fas fa-music"></i>
                音频资源
            </div>
            <div class="filter-tab" data-filter="video">
                <i class="fas fa-video"></i>
                视频资源
            </div>
            <div class="filter-tab" data-filter="tiles">
                <i class="fas fa-map"></i>
                地图瓦片
            </div>
        </div>
    </div>

    <!-- Resources Grid -->
    <main class="container">
        <div class="resources-grid" id="resources-grid">
            <!-- Resources will be dynamically loaded here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display: none;">
            <div class="empty-icon">
                <i class="fas fa-search"></i>
            </div>
            <h3>未找到匹配的资源</h3>
            <p>请尝试调整搜索条件或选择其他分类</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p><strong>Web3D 资源库</strong> - Three.js、Cesium、WebGPU、Vue.js 资源文件库</p>
                <p>本资源库仅供学习使用，请遵守相关法律法规</p>
                <p>© 2024 Web3D Resource Library. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // 资源数据
        const resources = [
            // 3D 模型 (GLB)
            {
                id: 1,
                title: "建筑模型集",

            },
            {
                id: 2,
                title: "机器人模型",
                description: "高精度机器人 3D 模型，包含完整的骨骼动画系统",
                type: "glb",

                url: "https://threelab.github.io/web3d-file-server/models/glb/robot.glb",
                size: "1.8MB",

            },
            {
                id: 3,
                title: "飞机模型",
                description: "多种飞机 3D 模型，适用于飞行模拟和航空可视化",
                type: "glb",

                url: "https://threelab.github.io/web3d-file-server/models/glb/plane.glb",
                size: "3.1MB",

            },
            {
                id: 4,
                title: "狐狸角色",
                description: "可爱的狐狸角色模型，支持动画和材质自定义",
                type: "glb",
                category: "动物",
                url: "https://threelab.github.io/web3d-file-server/files/model/Fox.glb",
                size: "1.2MB",
                icon: "fa-paw"
            },

            // 贴图材质
            {
                id: 5,
                title: "HDR 环境贴图",
                description: "高质量 HDR 环境贴图，提供真实的光照和环境反射",
                type: "texture",
                category: "环境",
                url: "https://threelab.github.io/web3d-file-server/files/hdr/1k.hdr",
                size: "15.6MB",
                icon: "fa-sun"
            },
            {
                id: 6,
                title: "法线贴图集",
                description: "多种材质的法线贴图，增强表面细节和真实感",
                type: "texture",
                category: "材质",
                url: "https://threelab.github.io/web3d-file-server/images/channels/n.png",
                size: "4.2MB",
                icon: "fa-mountain"
            },
            {
                id: 7,
                title: "天空盒贴图",
                description: "6 面天空盒贴图，创建逼真的天空环境",
                type: "texture",
                category: "环境",
                url: "https://threelab.github.io/web3d-file-server/files/sky/skyBox0/1.png",
                size: "8.7MB",
                icon: "fa-cloud"
            },

            // 数据文件
            {
                id: 8,
                title: "3D Tiles 房屋",
                description: "基于 3D Tiles 标准的房屋瓦片数据，支持大规模场景加载",
                type: "tiles",

                url: "https://threelab.github.io/web3d-file-server/3dtiles/house/tileset.json",
                size: "12.3MB",

            },
            {
                id: 9,
                title: "地理 JSON 数据",
                description: "广东省地理边界数据，适用于地图可视化和地理分析",
                type: "json",
                category: "地理",
                url: "https://threelab.github.io/web3d-file-server/files/json/guangdong.json",
                size: "2.1MB",
                icon: "fa-map"
            },
            {
                id: 10,
                title: "字体 JSON 数据",
                description: "中英文字体数据文件，支持 3D 文字渲染",
                type: "json",
                category: "字体",
                url: "https://threelab.github.io/web3d-file-server/files/json/font_zn.json",
                size: "3.4MB",
                icon: "fa-font"
            },

            // 音频资源
            {
                id: 11,
                title: "背景音乐",
                description: "高质量背景音乐，适用于游戏和多媒体项目",
                type: "audio",
                category: "音乐",
                url: "https://threelab.github.io/web3d-file-server/files/audio/Avicii-WeBurn.mp3",
                size: "5.6MB",
                icon: "fa-music"
            },

            // 视频资源
            {
                id: 12,
                title: "演示视频",
                description: "3D 场景演示视频，展示各种特效和动画",
                type: "video",
                category: "演示",
                url: "https://threelab.github.io/web3d-file-server/files/video/video.mp4",
                size: "28.9MB",
                icon: "fa-video"
            },

            // 更多资源...
            {
                id: 13,
                title: "城市白膜模型",
                description: "上海城市白膜 FBX 模型，适用于城市规划展示",
                type: "glb",
                category: "建筑",
                url: "https://threelab.github.io/web3d-file-server/models/fbx/shanghai.FBX",
                size: "45.2MB",
                icon: "fa-city"
            },
            {
                id: 14,
                title: "咖啡杯模型",
                description: "精致的咖啡杯 3D 模型，包含材质和纹理",
                type: "glb",
                category: "物品",
                url: "https://threelab.github.io/web3d-file-server/examples/coffeeMug/coffeeMug.glb",
                size: "0.8MB",
                icon: "fa-mug-hot"
            },
            {
                id: 15,
                title: "地球贴图",
                description: "高分辨率地球表面贴图，适用于全球可视化",
                type: "texture",
                category: "地理",
                url: "https://threelab.github.io/web3d-file-server/threeExamples/application/flyLine/earth.jpeg",
                size: "6.3MB",
                icon: "fa-globe"
            }
        ];

        // 状态管理
        let filteredResources = [...resources];
        let currentFilter = 'all';
        let currentSearch = '';

        // DOM 元素
        const resourcesGrid = document.getElementById('resources-grid');
        const searchInput = document.getElementById('search-input');
        const filterTabs = document.querySelectorAll('.filter-tab');
        const emptyState = document.getElementById('empty-state');
        const totalFiles = document.getElementById('total-files');
        const totalCategories = document.getElementById('total-categories');
        const totalSize = document.getElementById('total-size');

        // 初始化统计信息
        function initStats() {
            totalFiles.textContent = resources.length;
            
            const categories = new Set(resources.map(r => r.category));
            totalCategories.textContent = categories.size;
            
            const totalSizeMB = resources.reduce((sum, r) => {
                const size = parseFloat(r.size);
                return sum + (isNaN(size) ? 0 : size);
            }, 0);
            totalSize.textContent = (totalSizeMB / 1024).toFixed(1) + ' GB';
        }

        // 过滤资源
        function filterResources() {
            filteredResources = resources.filter(resource => {
                const matchesSearch = currentSearch === '' || 
                    resource.title.toLowerCase().includes(currentSearch.toLowerCase()) ||
                    resource.description.toLowerCase().includes(currentSearch.toLowerCase()) ||
                    resource.category.toLowerCase().includes(currentSearch.toLowerCase());
                
                const matchesFilter = currentFilter === 'all' || resource.type === currentFilter;
                
                return matchesSearch && matchesFilter;
            });
            
            renderResources();
        }

        // 渲染资源卡片
        function renderResources() {
            resourcesGrid.innerHTML = '';
            
            if (filteredResources.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            filteredResources.forEach((resource, index) => {
                const card = document.createElement('div');
                card.className = 'resource-card fade-in';
                card.style.animationDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div class="resource-icon">
                        <i class="fas ${resource.icon}"></i>
                    </div>
                    <h3 class="resource-title">${resource.title}</h3>
                    <p class="resource-description">${resource.description}</p>
                    <div class="resource-meta">
                        <span class="resource-type">${resource.category}</span>
                        <div class="resource-actions">
                            <button class="action-btn" onclick="previewResource('${resource.url}')" title="预览">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="action-btn" onclick="copyToClipboard('${resource.url}')" title="复制链接">
                                <i class="fas fa-copy"></i>
                            </button>
                            <button class="action-btn" onclick="downloadResource('${resource.url}', '${resource.title}')" title="下载">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                    <div style="margin-top: 10px; font-size: 0.8rem; color: #94a3b8;">
                        <i class="fas fa-database"></i> ${resource.size}
                    </div>
                `;
                
                resourcesGrid.appendChild(card);
            });
        }

        // 复制到剪贴板
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('链接已复制到剪贴板');
            }).catch(err => {
                console.error('复制失败:', err);
                showToast('复制失败，请手动复制');
            });
        }

        // 预览资源
        function previewResource(url) {
            window.open(url, '_blank');
        }

        // 下载资源
        function downloadResource(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename || 'resource';
            link.click();
        }

        // 显示提示信息
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <i class="fas fa-check-circle"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                document.body.removeChild(toast);
            }, 3000);
        }

        // 初始化事件监听
        function initEventListeners() {
            // 搜索功能
            searchInput.addEventListener('input', (e) => {
                currentSearch = e.target.value;
                filterResources();
            });

            // 筛选功能
            filterTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    filterTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.filter;
                    filterResources();
                });
            });
        }

        // 初始化应用
        function init() {
            initStats();
            initEventListeners();
            filterResources();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
